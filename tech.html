<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Citizen App - Request Technician</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f17; color: #ffffff; }
  </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col justify-between p-4 sm:p-6 pb-24">

  <!-- Navigation Bar -->
  <header class="w-full max-w-2xl mx-auto flex items-center justify-between pb-6 border-b border-zinc-800">
    <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='citizen.html'">
      <div class="w-9 h-9 rounded-full bg-teal-500/20 border border-teal-500/40 flex items-center justify-center">
        <svg class="w-5 h-5 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      </div>
      <span class="font-bold text-lg text-white">Citizen App</span>
    </div>
    <a href="reports.html" class="px-4 py-2 rounded-full bg-zinc-900 border border-zinc-800 text-xs font-semibold text-zinc-300 hover:bg-zinc-800 transition-all">Back to Reports</a>
  </header>

  <!-- Main View Area -->
  <main class="w-full max-w-2xl mx-auto flex-1 mt-6">
    
    <!-- STEP 1: REQUEST FORM -->
    <div id="form-card" class="bg-zinc-900/90 border border-zinc-800 rounded-3xl p-6 shadow-2xl space-y-6">
      <div>
        <h1 class="text-xl font-black text-white">Request Technician Assistance</h1>
        <p class="text-xs text-zinc-400 mt-1">Select your issue category and provide details to locate an available specialist near you.</p>
      </div>

      <form onsubmit="processTechnicianRequest(event)" class="space-y-4">
        <!-- Service Category Selector -->
        <div>
          <label class="block text-xs font-bold text-zinc-300 mb-2">Service Category</label>
          <select id="tech-category" class="w-full bg-zinc-950 border border-zinc-800 text-white rounded-xl p-3 text-xs focus:outline-none focus:border-teal-500">
            <option value="Plumbing Issue">🔧 Plumbing Issue</option>
            <option value="Vehicle Repair">🚗 Vehicle Repair</option>
            <option value="Electrical Repair" selected>⚡ Electrical Repair</option>
            <option value="Building Repair">🏗️ Building Repair</option>
            <option value="AC & Refrigeration">❄️ AC & Refrigeration</option>
            <option value="Carpentry & Roofing">🪵 Carpentry & Roofing</option>
          </select>
        </div>

        <!-- Issue Description -->
        <div>
          <label class="block text-xs font-bold text-zinc-300 mb-2">Description</label>
          <textarea id="tech-desc" rows="3" required placeholder="Describe the specific malfunction or repair needed..." class="w-full bg-zinc-950 border border-zinc-800 text-white rounded-xl p-3 text-xs focus:outline-none focus:border-teal-500"></textarea>
        </div>

        <!-- File / Video Upload -->
        <div>
          <label class="block text-xs font-bold text-zinc-300 mb-2">Upload Photo / Optional Video</label>
          <input type="file" id="tech-media" accept="image/*,video/*" class="w-full bg-zinc-950 border border-zinc-800 text-zinc-400 rounded-xl p-2 text-xs focus:outline-none" />
        </div>

        <button type="submit" class="w-full bg-teal-500 hover:bg-teal-600 text-black font-bold p-3 rounded-xl transition-colors text-xs uppercase tracking-wider">
          Find Nearby Technician
        </button>
      </form>
    </div>

    <!-- STEP 2: SEARCHING ANIMATION (PoC SIMULATION) -->
    <div id="searching-card" class="hidden bg-zinc-900/90 border border-zinc-800 rounded-3xl p-10 shadow-2xl flex-col items-center justify-center text-center space-y-4">
      <div class="relative w-16 h-16 flex items-center justify-center">
        <div class="absolute inset-0 rounded-full border-4 border-teal-500/20 border-t-teal-500 animate-spin"></div>
        <span class="text-2xl">📡</span>
      </div>
      <h3 class="text-base font-bold text-white">Searching for nearby workers...</h3>
      <p class="text-xs text-zinc-400 max-w-xs">Connecting to available technicians within your area. Please wait a moment.</p>
    </div>

    <!-- STEP 3: TRACKER VIEW (Loaded via JS) -->
    <div id="tracker-view" class="hidden grid grid-cols-1 gap-6">
      <!-- Renders Stepper, Map & Chat upon match -->
    </div>

  </main>

  <!-- Bottom Navigation Dock -->
  <div class="fixed bottom-5 left-0 w-full z-40 px-4 pointer-events-none">
    <nav class="max-w-md mx-auto bg-zinc-900/95 backdrop-blur-xl border border-zinc-800/80 rounded-full py-2.5 px-6 shadow-2xl shadow-black pointer-events-auto flex items-center justify-between text-center text-xs font-medium text-zinc-400">
      <a href="citizen.html" class="flex flex-col items-center gap-0.5 hover:text-zinc-200 transition-colors">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span class="text-[10px]">Home</span>
      </a>
      <a href="map.html" class="flex flex-col items-center gap-0.5 hover:text-zinc-200 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
        <span class="text-[10px]">Map</span>
      </a>
      <a href="report.html" class="flex items-center justify-center w-11 h-11 -mt-5 rounded-full bg-blue-600 text-white shadow-lg shadow-blue-500/40 hover:scale-105 transition-transform">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      </a>
      <a href="reports.html" class="flex flex-col items-center gap-0.5 text-blue-400 font-bold">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <span class="text-[10px]">Reports</span>
      </a>
      <a href="profile.html" class="flex flex-col items-center gap-0.5 hover:text-zinc-200 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span class="text-[10px]">Profile</span>
      </a>
    </nav>
  </div>

  <script>
    function processTechnicianRequest(e) {
      e.preventDefault();
      
      const formCard = document.getElementById('form-card');
      const searchingCard = document.getElementById('searching-card');
      
      formCard.classList.add('hidden');
      searchingCard.classList.remove('hidden');
      searchingCard.classList.add('flex');

      const ticketId = "TECH-" + Math.floor(1000 + Math.random() * 9000);
      const newReport = {
        id: ticketId,
        type: document.getElementById('tech-category').value,
        description: document.getElementById('tech-desc').value,
        category: "Technician Request",
        lat: 5.6037,
        lng: -0.1870,
        date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      // Store in localStorage for reports.html feed
      const existing = JSON.parse(localStorage.getItem('user_reports') || '[]');
      existing.unshift(newReport);
      localStorage.setItem('user_reports', JSON.stringify(existing));

      // Simulate searching delay (3 seconds) then reveal tracker
      setTimeout(() => {
        window.location.href = `tech.html?id=${ticketId}&view=track`;
      }, 3000);
    }
  </script>
</body>
</html>
