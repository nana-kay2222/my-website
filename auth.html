<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In / Sign Up | Smart Inspector</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
  <link rel="stylesheet" href="css/auth.css">

  <style>
    /* Shake animation for error feedback */
    @keyframes cardShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }
    .animate-shake {
      animation: cardShake 0.4s ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-4 my-8 bg-cover bg-center bg-no-repeat bg-fixed text-gray-100 font-sans" style="background-image: url('iingg.png') !important;">

  <!-- Main Container Card -->
  <div id="auth-card" class="w-full max-w-lg bg-gray-900/75 backdrop-blur-md border border-gray-700/60 rounded-2xl p-6 sm:p-8 shadow-2xl transition-all duration-300 hover:border-blue-500/30 hover:shadow-blue-900/10">
    
    <!-- Title -->
    <div class="text-center mb-6">
      <h1 class="text-2xl sm:text-3xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">
        Welcome to Smart Inspector
      </h1>
      <p id="auth-subtitle" class="text-gray-400 text-sm mt-1 transition-all duration-300">Sign in to your account to continue</p>
    </div>

    <!-- Error/Success Alert Box -->
    <div id="alert-box" class="hidden mb-4 p-3 rounded-lg text-sm font-semibold text-center transition-all duration-300"></div>

    <!-- Toggle Tabs (Sign In / Sign Up) -->
    <div class="flex bg-gray-900/90 p-1 rounded-xl mb-6 border border-gray-700/80">
      <button type="button" id="tab-signin" class="w-1/2 py-2.5 rounded-lg font-semibold text-sm transition-all duration-200 bg-blue-600 text-white shadow cursor-pointer">
        Sign In
      </button>
      <button type="button" id="tab-signup" class="w-1/2 py-2.5 rounded-lg font-semibold text-sm transition-all duration-200 text-gray-400 hover:text-white cursor-pointer">
        Sign Up
      </button>
    </div>

    <!-- Form -->
    <form id="auth-form" class="space-y-4" novalidate>
      
      <!-- SIGN UP EXTRA FIELDS (Hidden on Sign In) -->
      <div id="signup-fields" class="hidden space-y-4 field-transition">
        
        <!-- Name Group: First, Middle, Last -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">First Name</label>
            <input type="text" id="first-name" placeholder="John"
              class="w-full bg-gray-900/80 border border-gray-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none transition"/>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Middle Name</label>
            <input type="text" id="middle-name" placeholder="K."
              class="w-full bg-gray-900/80 border border-gray-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none transition"/>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Last Name</label>
            <input type="text" id="last-name" placeholder="Doe"
              class="w-full bg-gray-900/80 border border-gray-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none transition"/>
          </div>
        </div>

        <!-- Phone & Address -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Phone Number</label>
            <input type="tel" id="phone" placeholder="+233 20 000 0000"
              class="w-full bg-gray-900/80 border border-gray-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none transition"/>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Home Address</label>
            <input type="text" id="address" placeholder="123 Street, City"
              class="w-full bg-gray-900/80 border border-gray-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none transition"/>
          </div>
        </div>

        <!-- Account Type -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">I am registering as:</label>
          <select id="user-role" class="w-full bg-gray-900/80 border border-gray-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none transition">
            <option value="CLIENT">Client / Citizen</option>
            <option value="technician">Field Inspector / Technician</option>
          </select>
        </div>

      </div>

      <!-- COMMON FIELDS (Email) -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com"
          class="w-full bg-gray-900/80 border border-gray-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none transition"/>
      </div>

      <!-- Password Fields -->
      <div id="password-group" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Password</label>
          <div class="relative">
            <input type="password" id="password" placeholder="••••••••"
              class="w-full bg-gray-900/80 border border-gray-700 rounded-lg p-3 pr-10 text-sm text-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none transition"/>
            <button type="button" class="toggle-password absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white p-1 focus:outline-none" data-target="password">
              <svg class="w-5 h-5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div id="confirm-password-field" class="hidden field-transition">
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Confirm Password</label>
          <div class="relative">
            <input type="password" id="confirm-password" placeholder="••••••••"
              class="w-full bg-gray-900/80 border border-gray-700 rounded-lg p-3 pr-10 text-sm text-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none transition"/>
            <button type="button" class="toggle-password absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white p-1 focus:outline-none" data-target="confirm-password">
              <svg class="w-5 h-5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submit-btn" class="w-full py-3 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white rounded-lg font-bold text-sm transition-all duration-200 cursor-pointer flex items-center justify-center gap-2 shadow-lg shadow-blue-900/20">
        <span id="btn-text">Sign In</span>
        <svg id="btn-spinner" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      </button>
    </form>

    <div class="my-4 text-center text-xs text-gray-500 font-bold uppercase tracking-wider">Or</div>

    <!-- Google Sign In Button -->
    <button type="button" id="google-btn" class="w-full py-3 bg-gray-900/90 hover:bg-gray-800 border border-gray-700/80 hover:border-gray-500 text-white rounded-lg text-sm font-semibold flex items-center justify-center gap-3 transition-all duration-200 cursor-pointer hover:shadow-lg active:scale-[0.99]">
      <svg class="w-5 h-5" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Sign in with Google
    </button>

  </div>

  <script src="js/config.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const authForm = document.getElementById('auth-form');
      const authCard = document.getElementById('auth-card');
      const tabSignin = document.getElementById('tab-signin');
      const tabSignup = document.getElementById('tab-signup');
      const signupFields = document.getElementById('signup-fields');
      const confirmPasswordField = document.getElementById('confirm-password-field');
      const authSubtitle = document.getElementById('auth-subtitle');
      const btnText = document.getElementById('btn-text');
      const btnSpinner = document.getElementById('btn-spinner');
      const alertBox = document.getElementById('alert-box');
      const togglePasswordBtns = document.querySelectorAll('.toggle-password');

      let isSignUpMode = false;

      // Tab Switching
      if (tabSignin && tabSignup) {
        tabSignin.addEventListener('click', () => {
          isSignUpMode = false;
          tabSignin.className = "w-1/2 py-2.5 rounded-lg font-semibold text-sm transition-all duration-200 bg-blue-600 text-white shadow cursor-pointer";
          tabSignup.className = "w-1/2 py-2.5 rounded-lg font-semibold text-sm transition-all duration-200 text-gray-400 hover:text-white cursor-pointer";
          signupFields.classList.add('hidden');
          confirmPasswordField.classList.add('hidden');
          authSubtitle.textContent = "Sign in to your account to continue";
          btnText.textContent = "Sign In";
          hideAlert();
        });

        tabSignup.addEventListener('click', () => {
          isSignUpMode = true;
          tabSignup.className = "w-1/2 py-2.5 rounded-lg font-semibold text-sm transition-all duration-200 bg-blue-600 text-white shadow cursor-pointer";
          tabSignin.className = "w-1/2 py-2.5 rounded-lg font-semibold text-sm transition-all duration-200 text-gray-400 hover:text-white cursor-pointer";
          signupFields.classList.remove('hidden');
          confirmPasswordField.classList.remove('hidden');
          authSubtitle.textContent = "Create a new account to get started";
          btnText.textContent = "Sign Up";
          hideAlert();
        });
      }

      // Password Toggle
      togglePasswordBtns.forEach((btn) => {
        btn.addEventListener('click', () => {
          const targetId = btn.getAttribute('data-target');
          const input = document.getElementById(targetId);
          if (input) {
            input.type = input.type === 'password' ? 'text' : 'password';
          }
        });
      });

      // Safely parse JSON or handle HTML/Text error responses
      async function parseResponse(response) {
        const contentType = response.headers.get("content-type");
        if (contentType && contentType.includes("application/json")) {
          return await response.json();
        }
        const text = await response.text();
        throw new Error(`Unexpected server response (${response.status}). Ensure the endpoint path is correct.`);
      }

      // Form Submit Handler
      if (authForm) {
        authForm.addEventListener('submit', async (e) => {
          e.preventDefault();

          const email = document.getElementById('email')?.value.trim();
          const password = document.getElementById('password')?.value;

          if (!email || !password) {
            showAlert("Please enter your email and password!", "error");
            return;
          }

          if (btnSpinner) btnSpinner.classList.remove('hidden');

          let baseUrl = (typeof API_BASE_URL !== 'undefined') ? API_BASE_URL : '';
          baseUrl = baseUrl.replace(/\/api\/?$/, '').replace(/\/$/, '');

          try {
            if (isSignUpMode) {
              const firstName = document.getElementById('first-name')?.value.trim() || '';
              const middleName = document.getElementById('middle-name')?.value.trim() || '';
              const lastName = document.getElementById('last-name')?.value.trim() || '';
              const role = document.getElementById('user-role')?.value || 'CLIENT';
              const confirmPassword = document.getElementById('confirm-password')?.value;

              if (password !== confirmPassword) {
                showAlert("Passwords do not match!", "error");
                if (btnSpinner) btnSpinner.classList.add('hidden');
                return;
              }

              const fullName = `${firstName} ${middleName} ${lastName}`.replace(/\s+/g, ' ').trim();

              const response = await fetch(`${baseUrl}/api/auth/signup`, {
                method: 'POST',
                headers: { 
                  'Content-Type': 'application/json',
                  'ngrok-skip-browser-warning': 'true'
                },
                body: JSON.stringify({ 
                  email, 
                  password, 
                  name: fullName, 
                  role: role, 
                  specialistType: role.toLowerCase() === 'technician' ? 'technician' : null 
                })
              });

              const data = await parseResponse(response);
              if (!response.ok) throw new Error(data.error || 'Failed to sign up');

              showAlert("Success! Account created. Redirecting...", "success");

              // Normalize role for comparison
              const activeRole = (data.role || role).toUpperCase();
              const displayName = fullName || data.name || firstName || 'User';

              localStorage.setItem("token", data.token);
              localStorage.setItem("user_name", displayName);
              localStorage.setItem("citizen_user_name", displayName);

              setTimeout(() => {
                if (activeRole === 'TECHNICIAN') {
                  window.location.href = `dashboard.html?name=${encodeURIComponent(displayName)}`;
                } else {
                  window.location.href = 'citizen.html';
                }
              }, 1000);

            } else {
              // LOGIN FLOW
              const response = await fetch(`${baseUrl}/api/auth/login`, {
                method: 'POST',
                headers: { 
                  'Content-Type': 'application/json',
                  'ngrok-skip-browser-warning': 'true'
                },
                body: JSON.stringify({ email, password })
              });

              const data = await parseResponse(response);
              if (!response.ok) throw new Error(data.error || 'Failed to sign in');

              showAlert("Signed in successfully! Redirecting...", "success");

              const activeRole = (data.role || '').toUpperCase();
              const displayName = data.name || data.user?.name || 'Technician';

              localStorage.setItem("token", data.token);
              localStorage.setItem("user_name", displayName);

              setTimeout(() => {
                if (activeRole === 'TECHNICIAN') {
                  window.location.href = `dashboard.html?name=${encodeURIComponent(displayName)}`;
                } else {
                  window.location.href = 'citizen.html';
                }
              }, 1000);
            }

          } catch (error) {
            showAlert(error.message, "error");
            if (btnSpinner) btnSpinner.classList.add('hidden');
          }
        });
      }

      function showAlert(message, type) {
        if (!alertBox) return;

        alertBox.textContent = message;
        alertBox.className = "mb-4 p-3 rounded-lg text-sm font-semibold text-center transition-all duration-300";

        if (type === 'success') {
          alertBox.classList.add('bg-green-500/20', 'text-green-300', 'border', 'border-green-500/40');
        } else {
          alertBox.classList.add('bg-red-500/20', 'text-red-300', 'border', 'border-red-500/40');
          if (authCard) {
            authCard.classList.remove('animate-shake');
            void authCard.offsetWidth;
            authCard.classList.add('animate-shake');
          }
        }
        alertBox.classList.remove('hidden');
        authCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      function hideAlert() {
        if (alertBox) alertBox.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
