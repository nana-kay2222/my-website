<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In / Sign Up | Smart Inspector</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="auth.css">
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col justify-center items-center p-4 my-8">

  <!-- Card Container -->
  <div class="w-full max-w-lg bg-gray-800 border border-gray-700 rounded-2xl p-6 sm:p-8 shadow-2xl">
    
    <!-- Title -->
    <div class="text-center mb-6">
      <h1 class="text-2xl sm:text-3xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">
        Welcome to Smart Inspector
      </h1>
      <p id="auth-subtitle" class="text-gray-400 text-sm mt-1">Sign in to your account to continue</p>
    </div>

    <!-- Toggle Tabs (Sign In / Sign Up) -->
    <div class="flex bg-gray-900 p-1 rounded-xl mb-6 border border-gray-700">
      <button type="button" id="tab-signin" class="w-1/2 py-2.5 rounded-lg font-semibold text-sm transition bg-blue-600 text-white shadow cursor-pointer">
        Sign In
      </button>
      <button type="button" id="tab-signup" class="w-1/2 py-2.5 rounded-lg font-semibold text-sm transition text-gray-400 hover:text-white cursor-pointer">
        Sign Up
      </button>
    </div>

    <!-- Form -->
    <form action="dashboard.html" id="auth-form" class="space-y-4">
      
      <!-- SIGN UP EXTRA FIELDS (Hidden on Sign In) -->
      <div id="signup-fields" class="hidden space-y-4">
        
        <!-- Name Group: First, Middle, Last -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">First Name</label>
            <input type="text" id="first-name" placeholder="John"
              class="signup-req w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 focus:outline-none"/>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Middle Name</label>
            <input type="text" id="middle-name" placeholder="K."
              class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 focus:outline-none"/>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Last Name</label>
            <input type="text" id="last-name" placeholder="Doe"
              class="signup-req w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 focus:outline-none"/>
          </div>
        </div>

        <!-- Phone & Address -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Phone Number</label>
            <input type="tel" id="phone" placeholder="+233 20 000 0000"
              class="signup-req w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 focus:outline-none"/>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Home Address</label>
            <input type="text" id="address" placeholder="123 Street, City"
              class="signup-req w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 focus:outline-none"/>
          </div>
        </div>

        <!-- Account Type (Extra feature added!) -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">I am registering as:</label>
          <select id="user-role" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 focus:outline-none">
            <option value="citizen">Citizen / Resident</option>
            <option value="worker">Field Inspector / Maintenance Worker</option>
          </select>
        </div>

      </div>

      <!-- COMMON FIELDS (Email) -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Email Address</label>
        <input type="email" placeholder="you@example.com" required
          class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 focus:outline-none"/>
      </div>

      <!-- Password Fields -->
      <div id="password-group" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Password</label>
          <input type="password" id="password" placeholder="••••••••" required
            class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 focus:outline-none"/>
        </div>

        <!-- Confirm Password (Hidden on Sign In) -->
        <div id="confirm-password-field" class="hidden">
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Confirm Password</label>
          <input type="password" id="confirm-password" placeholder="••••••••"
            class="signup-req w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 focus:outline-none"/>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submit-btn" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-bold text-sm transition cursor-pointer">
        Sign In
      </button>
    </form>

    <div class="my-4 text-center text-xs text-gray-500 font-bold uppercase">Or</div>

    <!-- Google Sign In Button -->
    <a href="dashboard.html" class="w-full py-3 bg-gray-900 hover:bg-gray-700 border border-gray-700 text-white rounded-lg text-sm flex items-center justify-center gap-3 transition">
      <svg class="w-5 h-5" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Sign in with Google
    </a>

  </div>

  <script src="auth.js">
    document.addEventListener('DOMContentLoaded', function() {
      const tabSignIn = document.getElementById('tab-signin');
      const tabSignUp = document.getElementById('tab-signup');
      const signupFields = document.getElementById('signup-fields');
      const confirmPasswordField = document.getElementById('confirm-password-field');
      const authSubtitle = document.getElementById('auth-subtitle');
      const submitBtn = document.getElementById('submit-btn');

      function showSignUp() {
        tabSignUp.className = "w-1/2 py-2.5 rounded-lg font-semibold text-sm transition bg-blue-600 text-white shadow cursor-pointer";
        tabSignIn.className = "w-1/2 py-2.5 rounded-lg font-semibold text-sm transition text-gray-400 hover:text-white cursor-pointer";
        if (signupFields) signupFields.classList.remove('hidden');
        if (confirmPasswordField) confirmPasswordField.classList.remove('hidden');
        if (authSubtitle) authSubtitle.innerText = "Create a new account to get started";
        if (submitBtn) submitBtn.innerText = "Create Account";
      }

      function showSignIn() {
        tabSignIn.className = "w-1/2 py-2.5 rounded-lg font-semibold text-sm transition bg-blue-600 text-white shadow cursor-pointer";
        tabSignUp.className = "w-1/2 py-2.5 rounded-lg font-semibold text-sm transition text-gray-400 hover:text-white cursor-pointer";
        if (signupFields) signupFields.classList.add('hidden');
        if (confirmPasswordField) confirmPasswordField.classList.add('hidden');
        if (authSubtitle) authSubtitle.innerText = "Sign in to your account to continue";
        if (submitBtn) submitBtn.innerText = "Sign In";
      }

      tabSignUp.onclick = showSignUp;
      tabSignIn.onclick = showSignIn;
    });
  </script>
</body>
</html></script>
</body>
</html>
