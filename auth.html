<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login &amp; Sign Up | Smart Inspector</title>

  <!-- Reliable Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Optional Dashboard Custom CSS -->
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="min-h-screen bg-gray-950 text-gray-100 font-sans flex items-center justify-center p-4">

  <!-- AUTH CONTAINER CARD -->
  <div class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl p-6 sm:p-8 space-y-6">
    
    <!-- APP BRANDING HEADER -->
    <div class="text-center space-y-2">
      <div class="inline-flex p-3 bg-blue-600/20 border border-blue-500/30 rounded-2xl mb-1">
        <svg class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
      </div>
      <h1 class="text-2xl font-extrabold text-white">Smart Inspector</h1>
      <p class="text-xs text-gray-400">Community Infrastructure Reporting &amp; Field Dispatch</p>
    </div>

    <!-- ROLE SELECTOR SWITCH -->
    <div class="space-y-2">
      <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 text-center">Select Your Account Role</label>
      <div class="grid grid-cols-2 gap-2 bg-gray-950 p-1.5 rounded-xl border border-gray-800">
        <button type="button" id="role-citizen-btn" class="role-btn py-2 text-xs font-bold rounded-lg bg-blue-600 text-white transition cursor-pointer flex items-center justify-center gap-1.5">
          <span>🏠</span> Citizen
        </button>
        <button type="button" id="role-inspector-btn" class="role-btn py-2 text-xs font-bold rounded-lg text-gray-400 hover:text-white transition cursor-pointer flex items-center justify-center gap-1.5">
          <span>🛠️</span> Inspector
        </button>
      </div>
    </div>

    <!-- AUTH MODE TABS (LOGIN VS SIGN UP) -->
    <div class="flex border-b border-gray-800 text-sm font-semibold text-center">
      <button type="button" id="tab-login" class="flex-1 pb-3 text-blue-400 border-b-2 border-blue-500 transition cursor-pointer">Sign In</button>
      <button type="button" id="tab-signup" class="flex-1 pb-3 text-gray-500 hover:text-gray-300 transition cursor-pointer">Create Account</button>
    </div>

    <!-- AUTHENTICATION FORM -->
    <form id="auth-form" class="space-y-4">
      
      <!-- Full Name (Only visible during Sign Up) -->
      <div id="field-fullname" class="hidden space-y-1">
        <label class="block text-xs font-semibold text-gray-300">Full Name</label>
        <input type="text" id="input-fullname" placeholder="John Doe" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition" />
      </div>

      <!-- Email Input -->
      <div class="space-y-1">
        <label class="block text-xs font-semibold text-gray-300">Email Address</label>
        <input type="email" id="input-email" required placeholder="name@domain.com" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition" />
      </div>

      <!-- Password Input -->
      <div class="space-y-1">
        <label class="block text-xs font-semibold text-gray-300">Password</label>
        <input type="password" id="input-password" required placeholder="••••••••" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition" />
      </div>

      <!-- Dynamic Action Button -->
      <button type="submit" id="submit-btn" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition shadow-lg cursor-pointer mt-2">
        Sign In as Citizen
      </button>

    </form>

    <!-- FOOTER HINT -->
    <div class="text-center text-[11px] text-gray-500 border-t border-gray-800/80 pt-4">
      <p>Demo Mode: Click <span class="text-blue-400 font-semibold">Sign In</span> to navigate directly into your dashboard workspace.</p>
    </div>

  </div>

  <script src="js/auth.js"></script>
</body>
</html>
