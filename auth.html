<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In / Sign Up | Smart Inspector</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="auth.css">
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-4 my-8 bg-cover bg-center bg-no-repeat bg-fixed text-gray-100 font-sans" style="background-image: url('iing.jpeg') !important;">

  <div class="w-full max-w-lg bg-gray-900/85 backdrop-blur-md border border-gray-700/60 rounded-2xl p-6 sm:p-8 shadow-2xl">
    
    <!-- Title -->
    <div class="text-center mb-6">
      <h1 class="text-2xl sm:text-3xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">
        Welcome to Smart Inspector
      </h1>
      <p id="auth-subtitle" class="text-gray-400 text-sm mt-1">Sign in to your account to continue</p>
    </div>

    <!-- Error/Success Alert Box -->
    <div id="alert-box" class="hidden mb-4 p-3 rounded-lg text-sm font-semibold text-center"></div>

    <!-- Toggle Tabs (Sign In / Sign Up) -->
    <div class="flex bg-gray-900 p-1 rounded-xl mb-6 border border-gray-700">
      <button type="button" id="tab-signin" class="w-1/2 py-2.5 rounded-lg font-semibold text-sm transition bg-blue-600 text-white shadow cursor-pointer">
        Sign In
      </button>
      <button type="button" id="tab-signup" class="w-1/2 py-2.5 rounded-lg font-semibold text-sm transition text-gray-400 hover:text-white cursor-pointer">
        Sign Up
      </button>
    </div>

    <!-- Form -->
    <form id="auth-form" class="space-y-4">
      
      <!-- SIGN UP EXTRA FIELDS (Hidden on Sign In) -->
      <div id="signup-fields" class="hidden space-y-4">
        
        <!-- Name Group: First, Middle, Last -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">First Name</label>
            <input type="text" id="first-name" placeholder="John"
              class="signup-req w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 focus:outline-none"/>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Middle Name</label>
            <input type="text" id="middle-name" placeholder="K."
              class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 focus:outline-none"/>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Last Name</label>
            <input type="text" id="last-name" placeholder="Doe"
              class="signup-req w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 focus:outline-none"/>
          </div>
        </div>

        <!-- Phone & Address -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Phone Number</label>
            <input type="tel" id="phone" placeholder="+233 20 000 0000"
              class="signup-req w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 focus:outline-none"/>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Home Address</label>
            <input type="text" id="address" placeholder="123 Street, City"
              class="signup-req w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 focus:outline-none"/>
          </div>
        </div>

        <!-- Account Type -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">I am registering as:</label>
          <select id="user-role" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 focus:outline-none">
            <option value="citizen">Citizen / Resident</option>
            <option value="worker">Field Inspector / Maintenance Worker</option>
          </select>
        </div>

      </div>

      <!-- COMMON FIELDS (Email) -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required
          class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 focus:outline-none"/>
      </div>

      <!-- Password Fields -->
      <div id="password-group" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Password</label>
          <input type="password" id="password" placeholder="••••••••" required
            class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 focus:outline-none"/>
        </div>

        <!-- Confirm Password (Hidden on Sign In) -->
        <div id="confirm-password-field" class="hidden">
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Confirm Password</label>
          <input type="password" id="confirm-password" placeholder="••••••••"
            class="signup-req w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 focus:outline-none"/>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submit-btn" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-bold text-sm transition cursor-pointer">
        Sign In
      </button>
    </form>

    <div class="my-4 text-center text-xs text-gray-500 font-bold uppercase">Or</div>

    <!-- Google Sign In Button -->
    <button type="button" id="google-btn" class="w-full py-3 bg-gray-900 hover:bg-gray-700 border border-gray-700 text-white rounded-lg text-sm flex items-center justify-center gap-3 transition cursor-pointer">
      <svg class="w-5 h-5" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Sign in with Google
    </button>

  </div>

  <!-- FIREBASE MODULE SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      GoogleAuthProvider, 
      signInWithPopup 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Your exact Firebase keys
    const firebaseConfig = {
      apiKey: "AIzaSyAzUBZb8RLSGqXVkNdvoSlw_K9qdLcJFbY",
      authDomain: "smart-inspector-e52ee.firebaseapp.com",
      projectId: "smart-inspector-e52ee",
      storageBucket: "smart-inspector-e52ee.firebasestorage.app",
      messagingSenderId: "235377303062",
      appId: "1:235377303062:web:0986ca72a752b60dd85f37"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    // DOM Elements
    const tabSignIn = document.getElementById('tab-signin');
    const tabSignUp = document.getElementById('tab-signup');
    const signupFields = document.getElementById('signup-fields');
    const confirmPasswordField = document.getElementById('confirm-password-field');
    const authSubtitle = document.getElementById('auth-subtitle');
    const submitBtn = document.getElementById('submit-btn');
    const authForm = document.getElementById('auth-form');
    const googleBtn = document.getElementById('google-btn');
    const alertBox = document.getElementById('alert-box');
    const signupRequiredInputs = document.querySelectorAll('.signup-req');

    let isSignUpMode = false;

    // Helper: Show alert messages
    function showAlert(msg, isError = true) {
      alertBox.innerText = msg;
      alertBox.className = `mb-4 p-3 rounded-lg text-sm font-semibold text-center block ${
        isError ? 'bg-red-900/80 text-red-200 border border-red-700' : 'bg-green-900/80 text-green-200 border border-green-700'
      }`;
    }

    // Toggle Tab Logic
    tabSignUp.onclick = () => {
      isSignUpMode = true;
      tabSignUp.className = "w-1/2 py-2.5 rounded-lg font-semibold text-sm transition bg-blue-600 text-white shadow cursor-pointer";
      tabSignIn.className = "w-1/2 py-2.5 rounded-lg font-semibold text-sm transition text-gray-400 hover:text-white cursor-pointer";
      signupFields.classList.remove('hidden');
      confirmPasswordField.classList.remove('hidden');
      signupRequiredInputs.forEach(i => i.setAttribute('required', 'true'));
      authSubtitle.innerText = "Create a new account to get started";
      submitBtn.innerText = "Create Account";
      alertBox.classList.add('hidden');
    };

    tabSignIn.onclick = () => {
      isSignUpMode = false;
      tabSignIn.className = "w-1/2 py-2.5 rounded-lg font-semibold text-sm transition bg-blue-600 text-white shadow cursor-pointer";
      tabSignUp.className = "w-1/2 py-2.5 rounded-lg font-semibold text-sm transition text-gray-400 hover:text-white cursor-pointer";
      signupFields.classList.add('hidden');
      confirmPasswordField.classList.add('hidden');
      signupRequiredInputs.forEach(i => i.removeAttribute('required'));
      authSubtitle.innerText = "Sign in to your account to continue";
      submitBtn.innerText = "Sign In";
      alertBox.classList.add('hidden');
    };

    // Form Submission (Sign In & Sign Up)
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        if (isSignUpMode) {
          const confirmPassword = document.getElementById('confirm-password').value;
          if (password !== confirmPassword) {
            showAlert("Passwords do not match!");
            return;
          }
          submitBtn.innerText = "Creating Account...";
          await createUserWithEmailAndPassword(auth, email, password);
          showAlert("Account created successfully! Redirecting...", false);
        } else {
          submitBtn.innerText = "Signing In...";
          await signInWithEmailAndPassword(auth, email, password);
          showAlert("Signed in successfully! Redirecting...", false);
        }

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1200);

      } catch (error) {
        submitBtn.innerText = isSignUpMode ? "Create Account" : "Sign In";
        showAlert(error.message.replace("Firebase: ", ""));
      }
    });

    // Google Sign-In Logic
    googleBtn.onclick = async () => {
      try {
        await signInWithPopup(auth, googleProvider);
        showAlert("Google Sign-In successful! Redirecting...", false);
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1200);
      } catch (error) {
        showAlert(error.message.replace("Firebase: ", ""));
      }
    };
  </script>
</body>
</html>
