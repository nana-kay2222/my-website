<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In / Sign Up | Smart Inspector</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="auth.css">
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col justify-center items-center p-4">

  <!-- Card Container -->
  <div class="w-full max-w-md bg-gray-800 border border-gray-700 rounded-2xl p-6 shadow-2xl">
    
    <!-- Title -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">
        Welcome to Smart Inspector
      </h1>
      <p class="text-gray-400 text-sm mt-1">Sign in or sign up to continue</p>
    </div>

    <!-- Form -->
    <form action="dashboard.html" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Email Address</label>
        <input type="email" placeholder="you@example.com" required
          class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 focus:outline-none"/>
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Password</label>
        <input type="password" placeholder="••••••••" required
          class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 focus:outline-none"/>
      </div>

      <!-- Sign In Button (Links straight to dashboard) -->
      <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-bold text-sm transition cursor-pointer">
        Sign In
      </button>
    </form>

    <div class="my-4 text-center text-xs text-gray-500 font-bold uppercase">Or</div>

    <!-- Google Sign In Button (Also links to dashboard) -->
    <a href="dashboard.html" class="w-full py-3 bg-gray-900 hover:bg-gray-700 border border-gray-700 text-white rounded-lg text-sm flex items-center justify-center gap-2 transition">
      <span>🌐</span> Sign in with Google
    </a>

  </div>

  <script src="auth.js"></script>
</body>
</html>
