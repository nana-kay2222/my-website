<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In / Sign Up | Smart Inspector</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col justify-center items-center p-4">

  <!-- Auth Card Container -->
  <div class="w-full max-w-md bg-gray-800/80 border border-gray-700 rounded-2xl p-6 sm:p-8 shadow-2xl backdrop-blur">
    
    <!-- Title -->
    <div class="text-center mb-6">
      <h1 class="text-2xl sm:text-3xl font-extrabold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">
        Welcome to Smart Inspector
      </h1>
      <p id="auth-subtitle" class="text-gray-400 text-sm mt-1">Sign in to your account to continue</p>
    </div>

    <!-- Toggle Tabs (Sign In / Sign Up) -->
    <div class="flex bg-gray-900 p-1 rounded-xl mb-6 border border-gray-700">
      <button id="tab-signin" class="w-1/2 py-2 rounded-lg font-semibold text-sm transition bg-blue-600 text-white shadow">
        Sign In
      </button>
      <button id="tab-signup" class="w-1/2 py-2 rounded-lg font-semibold text-sm transition text-gray-400 hover:text-white">
        Sign Up
      </button>
    </div>

    <!-- Form -->
    <form id="auth-form" class="space-y-4">
      <!-- Full Name (Hidden by default for Sign In, shown for Sign Up) -->
      <div id="name-field" class="hidden">
        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Full Name</label>
        <input type="text" id="name-input" placeholder="e.g. Alex Johnson"
          class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 focus:outline-none"/>
      </div>

      <!-- Email Input -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Email Address</label>
        <input type="email" id="email-input" placeholder="you@example.com" required
          class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 focus:outline-none"/>
      </div>

      <!-- Password Input -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Password</label>
        <input type="password" id="password-input" placeholder="••••••••" required
          class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 focus:outline-none"/>
      </div>

      <!-- Main Submit Button -->
      <button type="submit" id="submit-btn" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-bold text-sm transition shadow-lg mt-2 cursor-pointer">
        Sign In
      </button>
    </form>

    <!-- Divider -->
    <div class="relative flex py-5 items-center">
      <div class="flex-grow border-t border-gray-700"></div>
      <span class="flex-shrink mx-4 text-gray-500 text-xs uppercase tracking-widest">Or</span>
      <div class="flex-grow border-t border-gray-700"></div>
    </div>

    <!-- Google Sign In Button -->
    <button id="google-btn" class="w-full py-3 bg-gray-900 hover:bg-gray-700 border border-gray-700 text-white rounded-lg font-medium text-sm transition flex items-center justify-center gap-3 cursor-pointer">
      <svg class="w-5 h-5" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Sign in with Google
    </button>

  </div>

  <script src="js/auth.js"></script>
</body>
</html>
