<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Citizen Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-black text-white font-sans min-h-screen flex flex-col justify-between antialiased pt-6 pb-12 px-4 sm:px-6">

  <main class="max-w-xl mx-auto w-full flex-1 space-y-6">
    <!-- Header -->
    <header class="flex items-center justify-between py-4 border-b border-zinc-800">
      <div>
        <h1 class="text-lg font-bold text-white tracking-wide">Citizen Portal</h1>
        <p class="text-xs text-zinc-400">Report issues and track community resolution</p>
      </div>
      <a href="reports.html" class="p-2.5 rounded-2xl bg-zinc-900 border border-zinc-800 text-zinc-300 hover:text-white transition-all cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
      </a>
    </header>

    <!-- Overview Stats Widget -->
    <div class="grid grid-cols-3 gap-3">
      <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 text-center space-y-1">
        <span id="totalCount" class="text-xl font-bold text-white">0</span>
        <p class="text-[11px] text-zinc-500 font-medium">Total Logged</p>
      </div>
      <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 text-center space-y-1">
        <span id="pendingCount" class="text-xl font-bold text-amber-400">0</span>
        <p class="text-[11px] text-zinc-500 font-medium">Pending</p>
      </div>
      <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 text-center space-y-1">
        <span id="resolvedCount" class="text-xl font-bold text-emerald-400">0</span>
        <p class="text-[11px] text-zinc-500 font-medium">Resolved</p>
      </div>
    </div>

    <!-- Main Action Hub -->
    <div class="space-y-3">
      <h2 class="text-xs font-bold uppercase tracking-wider text-zinc-400 px-1">Quick Actions</h2>
      
      <a href="report.html?type=community" class="block bg-zinc-900 border border-zinc-800 hover:border-blue-500/50 rounded-3xl p-5 transition-all group">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-2xl bg-blue-600/10 border border-blue-500/20 text-blue-400 flex items-center justify-center">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
            </div>
            <div>
              <h3 class="text-sm font-bold text-white group-hover:text-blue-400 transition-colors">Report Community Issue</h3>
              <p class="text-xs text-zinc-400 mt-0.5">Potholes, sanitation, streetlight outages</p>
            </div>
          </div>
          <svg class="w-5 h-5 text-zinc-600 group-hover:text-blue-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </div>
      </a>

      <a href="report.html?type=technical" class="block bg-zinc-900 border border-zinc-800 hover:border-purple-500/50 rounded-3xl p-5 transition-all group">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-2xl bg-purple-600/10 border border-purple-500/20 text-purple-400 flex items-center justify-center">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </div>
            <div>
              <h3 class="text-sm font-bold text-white group-hover:text-purple-400 transition-colors">Request Technical Help</h3>
              <p class="text-xs text-zinc-400 mt-0.5">Utility maintenance, structural dispatch</p>
            </div>
          </div>
          <svg class="w-5 h-5 text-zinc-600 group-hover:text-purple-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </div>
      </a>
    </div>

    <!-- Recent Activity Section -->
    <div class="space-y-3">
      <div class="flex items-center justify-between px-1">
        <h2 class="text-xs font-bold uppercase tracking-wider text-zinc-400">Recent Activity</h2>
        <a href="reports.html" class="text-xs font-semibold text-blue-400 hover:underline">View All</a>
      </div>
      
      <div id="latestReportContainer">
        <!-- Injected dynamically via JS -->
      </div>
    </div>
  </main>

  <script>
    function loadDashboardData() {
      const reports = JSON.parse(localStorage.getItem("user_reports") || "[]");

      // Update counters
      document.getElementById('totalCount').innerText = reports.length;
      document.getElementById('pendingCount').innerText = reports.filter(r => (r.status || 'Pending Review') === 'Pending Review').length;
      document.getElementById('resolvedCount').innerText = reports.filter(r => r.status === 'Resolved').length;

      const container = document.getElementById('latestReportContainer');

      if (reports.length === 0) {
        container.innerHTML = `
          <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 text-center space-y-2">
            <p class="text-xs text-zinc-400">No active submissions logged yet.</p>
            <a href="report.html" class="inline-block text-xs font-bold text-blue-400">Submit your first report →</a>
          </div>
        `;
        return;
      }

      const latest = reports[0];
      container.innerHTML = `
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-5 space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-zinc-400">${latest.id}</span>
            <span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-blue-950/80 text-blue-400 border border-blue-800/50">${latest.status || 'Pending Review'}</span>
          </div>
          <div class="flex gap-4 items-center">
            <img src="${latest.photo || latest.image}" class="w-16 h-16 rounded-2xl object-cover bg-zinc-950 border border-zinc-800 flex-shrink-0">
            <div class="space-y-1 overflow-hidden">
              <p class="text-xs font-semibold text-white line-clamp-2">${latest.description}</p>
              <p class="text-[11px] text-zinc-400 truncate">📍 ${latest.address}</p>
            </div>
          </div>
        </div>
      `;
    }

    window.onload = loadDashboardData;
  </script>
</body>
</html>
