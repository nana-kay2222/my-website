<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Inspector | Welcome</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="home.css">
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col justify-between items-center p-6">

  <!-- Main Container -->
  <main class="max-w-3xl w-full text-center my-auto flex flex-col items-center gap-8">
    
    <!-- Header Title & Brief Description -->
    <div>
      <h1 class="text-4xl sm:text-5xl font-extrabold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent mb-4">
        Smart Inspector AI
      </h1>
      <p class="text-gray-300 text-base sm:text-lg max-w-xl mx-auto leading-relaxed">
        The intelligent portal connecting citizens, households, and maintenance crews. Report city hazards instantly, get virtual assistance for home fixes, or join local response teams.
      </p>
    </div>

    <!-- Visual Box: Infrastructure & People -->
    <div class="visual-box w-full bg-gradient-to-br from-gray-800 to-gray-900 border border-gray-700 rounded-2xl p-8 shadow-2xl relative overflow-hidden">
      <div class="grid grid-cols-2 gap-4 items-center justify-center">
        <!-- Infrastructure Visual -->
        <div class="bg-gray-800/80 p-6 rounded-xl border border-blue-500/30 flex flex-col items-center gap-2">
          <span class="text-5xl">🏙️</span>
          <span class="text-xs font-semibold text-blue-400 uppercase tracking-wide">Infrastructure</span>
        </div>
        <!-- People / Community Visual -->
        <div class="bg-gray-800/80 p-6 rounded-xl border border-indigo-500/30 flex flex-col items-center gap-2">
          <span class="text-5xl">👥</span>
          <span class="text-xs font-semibold text-indigo-400 uppercase tracking-wide">Community & Workers</span>
        </div>
      </div>
    </div>

    <!-- Get Started Button -->
    <a href="auth.html" class="w-full max-w-md py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold text-lg rounded-xl shadow-xl text-center block transition-all duration-200 transform hover:scale-[1.02]">
  🚀 Get Started / Try Out
</a>

  </main>

  <script src="home.js"></script>
</body>
</html>
