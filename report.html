<script src="js/config.js"></script>

<script>
  document.getElementById('report-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const submitBtn = document.getElementById('submit-btn');
    const statusBox = document.getElementById('status-message');
    
    // Disable button to prevent double submissions
    submitBtn.disabled = true;
    submitBtn.innerText = "Submitting Report...";

    try {
      const formData = new FormData();

      // 1. Text & Location Metadata
      const category = document.getElementById('category')?.value || 'Community Problem';
      const description = document.getElementById('description')?.value || '';
      const latitude = document.getElementById('latitude')?.value || '';
      const longitude = document.getElementById('longitude')?.value || '';

      formData.append('category', category);
      formData.append('description', description);
      formData.append('latitude', latitude);
      formData.append('longitude', longitude);

      // 2. Attach File Inputs (Using exact Multer field names)
      const photoInput = document.getElementById('photo-input'); // Image file input element
      const videoInput = document.getElementById('video-input'); // Video file input element
      const audioInput = document.getElementById('audio-input'); // Audio file input element

      // CRITICAL: Key must be 'media' for Multer matching
      if (photoInput && photoInput.files[0]) {
        formData.append('media', photoInput.files[0]);
      }

      // Key must be 'video'
      if (videoInput && videoInput.files[0]) {
        formData.append('video', videoInput.files[0]);
      }

      // Key must be 'audio'
      if (audioInput && audioInput.files[0]) {
        formData.append('audio', audioInput.files[0]);
      }

      // 3. Send POST Request
      const token = localStorage.getItem('token');
      const response = await fetch(`${API_BASE_URL}/api/reports`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${token}`,
          'ngrok-skip-browser-warning': 'true'
          // Note: Do NOT set 'Content-Type' manually when sending FormData; 
          // the browser will automatically add multipart/form-data with the boundary.
        },
        body: formData
      });

      const result = await response.json();

      if (!response.ok) {
        throw new Error(result.message || `Server Error: ${response.status}`);
      }

      // Success Feedback
      alert("Report submitted successfully!");
      window.location.href = 'reports.html';

    } catch (error) {
      console.error("Submission failed:", error);
      if (statusBox) {
        statusBox.classList.remove('hidden');
        statusBox.innerText = `Error: ${error.message}`;
      } else {
        alert(`Failed to submit: ${error.message}`);
      }
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "Submit Report";
    }
  });
</script>
