<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Citizen App - Submit Report</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f17; color: #ffffff; }
  </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col justify-between p-4 sm:p-6 pb-28">

  <!-- Header Navigation -->
  <header class="w-full max-w-4xl mx-auto flex items-center justify-between pb-6 border-b border-zinc-800">
    <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='citizen.html'">
      <div class="w-9 h-9 rounded-xl bg-blue-500/20 border border-blue-500/40 flex items-center justify-center shadow-lg shadow-blue-500/10">
        <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h4m-4 0V11m0 0h4m-4 0H9m4 0V5" />
        </svg>
      </div>
      <span class="font-black text-xl tracking-tight text-white">Citizen App</span>
    </div>

    <a href="reports.html" class="text-xs font-bold text-zinc-400 hover:text-white bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded-full transition-colors">
      View All Reports ➔
    </a>
  </header>

  <!-- Main Content Form -->
  <main class="w-full max-w-2xl mx-auto flex-1 mt-6">
    <div class="bg-zinc-900/90 border border-zinc-800 rounded-2xl p-6 sm:p-8 shadow-2xl space-y-6">
      
      <div>
        <h1 class="text-2xl font-black text-white">Submit Community Report</h1>
        <p class="text-xs text-zinc-400 mt-1">Report municipal or infrastructure issues directly to field teams.</p>
      </div>

      <!-- Feedback Banner -->
      <div id="status-message" class="hidden p-4 rounded-xl text-xs font-bold border"></div>

      <form id="report-form" class="space-y-4">
        
        <!-- Category Selection -->
        <div>
          <label class="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2">Category</label>
          <select id="category" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition-colors">
            <option value="Community Problem">Community Problem</option>
            <option value="Road Infrastructure">Road Infrastructure (Potholes, Signals)</option>
            <option value="Sanitation & Waste">Sanitation & Waste</option>
            <option value="Public Safety">Public Safety</option>
            <option value="Water & Sewage">Water & Sewage</option>
          </select>
        </div>

        <!-- Issue Title/Type -->
        <div>
          <label class="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2">Issue Title</label>
          <input type="text" id="type" required placeholder="e.g. Major Pothole near Main St." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-blue-500 transition-colors" />
        </div>

        <!-- Description -->
        <div>
          <label class="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2">Detailed Description</label>
          <textarea id="description" rows="4" required placeholder="Describe the location, hazard level, or explicit details..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-blue-500 transition-colors"></textarea>
        </div>

        <!-- Optional Image URL/Data -->
        <div>
          <label class="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2">Image URL (Optional)</label>
          <input type="url" id="image" placeholder="https://example.com/photo.jpg" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-blue-500 transition-colors" />
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submit-btn" class="w-full py-3.5 px-6 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm shadow-lg shadow-blue-600/30 transition-all cursor-pointer flex items-center justify-center gap-2">
          <span>Send Community Report</span>
        </button>

      </form>
    </div>
  </main>

  <script src="js/config.js"></script>

  <script>
    document.getElementById('report-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const statusMsg = document.getElementById('status-message');
      const submitBtn = document.getElementById('submit-btn');

      const category = document.getElementById('category').value;
      const type = document.getElementById('type').value;
      const description = document.getElementById('description').value;
      const image = document.getElementById('image').value;

      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting Report...";

      try {
        const token = localStorage.getItem('token');

        // Sanitize API base URL so it points to /api/issues safely
        let baseUrl = (typeof API_BASE_URL !== 'undefined') ? API_BASE_URL : '';
        baseUrl = baseUrl.replace(/\/api\/?$/, '').replace(/\/$/, '');
        
        const endpoint = `${baseUrl}/api/issues`;

        const response = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json',
            'ngrok-skip-browser-warning': 'true'
          },
          body: JSON.stringify({
            category,
            type,
            description,
            image: image || null,
            status: 'Under Review'
          })
        });

        if (!response.ok) {
          throw new Error(`Server returned HTTP ${response.status}: ${response.statusText}`);
        }

        statusMsg.className = "p-4 rounded-xl text-xs font-bold border border-teal-500/30 bg-teal-950/40 text-teal-400 block";
        statusMsg.innerText = "Report submitted successfully! Redirecting to feed...";

        setTimeout(() => {
          window.location.href = 'reports.html';
        }, 1500);

      } catch (error) {
        console.error('Submission error:', error);
        statusMsg.className = "p-4 rounded-xl text-xs font-bold border border-red-900/50 bg-red-950/40 text-red-400 block";
        statusMsg.innerText = `Failed to submit report: ${error.message}`;
        
        submitBtn.disabled = false;
        submitBtn.innerText = "Send Community Report";
      }
    });
  </script>
</body>
</html>
