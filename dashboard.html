<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard | Smart Inspector</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col justify-center items-center p-4">

  <!-- Main Container -->
  <main class="w-full max-w-2xl bg-gray-800/80 border border-gray-700 rounded-2xl p-6 sm:p-10 shadow-2xl backdrop-blur text-center">
    
    <!-- Greeting Header -->
    <h1 id="user-greeting" class="text-3xl sm:text-4xl font-extrabold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent mb-2">
      Hi, User!
    </h1>
    <p class="text-gray-300 text-base sm:text-lg mb-8">
      What would you like to do today?
    </p>

    <!-- 3 Core Options Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
      
      <!-- Option 1: Report Infrastructure -->
      <a href="report-infrastructure.html" class="option-card bg-gray-900/80 border border-blue-500/30 hover:border-blue-500 p-6 rounded-xl flex flex-col items-center gap-3 transition transform hover:-translate-y-1 group cursor-pointer">
        <span class="text-4xl">🏙️</span>
        <h3 class="font-bold text-sm text-blue-400 group-hover:text-blue-300">Report Infrastructure</h3>
        <p class="text-xs text-gray-400">Potholes, lighting, public utilities</p>
      </a>

      <!-- Option 2: Get Personal Help -->
      <a href="personal-help.html" class="option-card bg-gray-900/80 border border-indigo-500/30 hover:border-indigo-500 p-6 rounded-xl flex flex-col items-center gap-3 transition transform hover:-translate-y-1 group cursor-pointer">
        <span class="text-4xl">🏠</span>
        <h3 class="font-bold text-sm text-indigo-400 group-hover:text-indigo-300">Get Personal Help</h3>
        <p class="text-xs text-gray-400">Home repairs, plumbing, HVAC virtual assistant</p>
      </a>

      <!-- Option 3: Join Workers -->
      <a href="join-workers.html" class="option-card bg-gray-900/80 border border-purple-500/30 hover:border-purple-500 p-6 rounded-xl flex flex-col items-center gap-3 transition transform hover:-translate-y-1 group cursor-pointer">
        <span class="text-4xl">👷‍♂️</span>
        <h3 class="font-bold text-sm text-purple-400 group-hover:text-purple-300">Join Workers</h3>
        <p class="text-xs text-gray-400">Become an inspector or maintenance tech</p>
      </a>

    </div>

    <!-- Sign Out Link -->
    <button id="logout-btn" class="text-xs text-gray-500 hover:text-gray-300 underline cursor-pointer">
      Sign Out
    </button>

  </main>

  <script src="js/dashboard.js"></script>
</body>
</html>
