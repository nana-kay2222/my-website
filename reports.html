<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reports - Citizen App</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body { background-color: #0b0f17; color: #ffffff; }
  </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col justify-between pb-28">

  <!-- Top Header -->
  <header class="w-full max-w-xl mx-auto px-6 pt-6 flex items-center justify-between">
    <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='citizen.html'">
      <span class="font-bold text-lg">Citizen App</span>
    </div>
    <a href="index.html" class="px-4 py-2 rounded-full bg-neutral-900 border border-neutral-800 text-xs font-semibold text-slate-300 hover:bg-neutral-800 transition-all">
      Sign out
    </a>
  </header>

  <!-- Main Content Area -->
  <main class="w-full max-w-xl mx-auto px-6 pt-6 flex-1 space-y-6">
    <div>
      <h1 class="text-xl font-bold text-white">Submitted Reports</h1>
      <p class="text-xs text-zinc-400 mt-1">Review your submitted community problems and technical help requests.</p>
    </div>

    <!-- Category Segregation Tabs -->
    <div class="flex border-b border-zinc-800 gap-6">
      <button onclick="switchTab('community')" id="tab-community" class="pb-3 text-sm font-bold text-blue-400 border-b-2 border-blue-500 transition-all cursor-pointer">
        Community Problems (<span id="count-community">0</span>)
      </button>
      <button onclick="switchTab('technical')" id="tab-technical" class="pb-3 text-sm font-bold text-zinc-500 hover:text-zinc-300 border-b-2 border-transparent transition-all cursor-pointer">
        Technical Help (<span id="count-technical">0</span>)
      </button>
    </div>

    <!-- List of Reports Container -->
    <div id="reportsContainer" class="space-y-4">
      <!-- Dynamic Javascript Content -->
    </div>
  </main>

  <!-- UNIVERSAL FLOATING NAVIGATION DOCK -->
  <div class="fixed bottom-5 left-0 w-full z-40 px-4 pointer-events-none">
    <nav class="max-w-md mx-auto bg-zinc-900/95 backdrop-blur-xl border border-zinc-800/80 rounded-full py-2.5 px-4 shadow-2xl shadow-black pointer-events-auto flex items-center justify-between text-center text-xs font-medium text-zinc-400">
      
      <!-- Home -->
      <a href="citizen.html" class="flex flex-col items-center gap-0.5 hover:text-zinc-200 transition-colors">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span class="text-[10px]">Home</span>
      </a>

      <!-- Map -->
      <a href="map.html" class="flex flex-col items-center gap-0.5 hover:text-zinc-200 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
        <span class="text-[10px]">Map</span>
      </a>

      <!-- Submit Report Action Button -->
      <a href="report.html" class="flex items-center justify-center w-11 h-11 -mt-5 rounded-full bg-blue-600 text-white shadow-lg shadow-blue-500/40 hover:scale-105 transition-transform">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      </a>

      <!-- Reports List (Active Page) -->
      <a href="reports.html" class="flex flex-col items-center gap-0.5 text-blue-400 font-bold">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <span class="text-[10px]">Reports</span>
      </a>

      <!-- Profile -->
      <a href="profile.html" class="flex flex-col items-center gap-0.5 hover:text-zinc-200 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span class="text-[10px]">Profile</span>
      </a>

    </nav>
  </div>

  <script>
    let activeTab = 'community';

    document.addEventListener("DOMContentLoaded", function () {
      renderReports();
    });

    function switchTab(tab) {
      activeTab = tab;
      const commTab = document.getElementById('tab-community');
      const techTab = document.getElementById('tab-technical');

      if (tab === 'community') {
        commTab.className = "pb-3 text-sm font-bold text-blue-400 border-b-2 border-blue-500 transition-all cursor-pointer";
        techTab.className = "pb-3 text-sm font-bold text-zinc-500 hover:text-zinc-300 border-b-2 border-transparent transition-all cursor-pointer";
      } else {
        techTab.className = "pb-3 text-sm font-bold text-blue-400 border-b-2 border-blue-500 transition-all cursor-pointer";
        commTab.className = "pb-3 text-sm font-bold text-zinc-500 hover:text-zinc-300 border-b-2 border-transparent transition-all cursor-pointer";
      }

      renderReports();
    }

    function renderReports() {
      const container = document.getElementById('reportsContainer');
      const allReports = JSON.parse(localStorage.getItem("user_reports") || "[]");

      const communityList = allReports.filter(r => r.type === 'Community Problem' || !r.type);
      const technicalList = allReports.filter(r => r.type === 'Technical Help');

      document.getElementById('count-community').textContent = communityList.length;
      document.getElementById('count-technical').textContent = technicalList.length;

      const activeList = activeTab === 'community' ? communityList : technicalList;

      if (activeList.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 bg-zinc-900/50 border border-zinc-800/80 rounded-3xl space-y-2">
            <svg class="w-10 h-10 text-zinc-600 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            <p class="text-sm font-semibold text-zinc-400">No ${activeTab === 'community' ? 'community' : 'technical'} reports found.</p>
            <p class="text-xs text-zinc-600">Click the '+' button to submit a new report.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = activeList.map(item => `
        <div class="bg-zinc-900 border border-zinc-800/80 rounded-2xl p-5 space-y-3 shadow-lg">
          <div class="flex items-start justify-between gap-3">
            <div>
              <span class="text-[10px] font-bold uppercase tracking-wider text-blue-400 px-2 py-0.5 rounded-full bg-blue-500/10 border border-blue-500/20">
                ${item.type}
              </span>
              <h3 class="text-sm font-bold text-white mt-1.5">${item.address || 'Address not specified'}</h3>
            </div>
            <span class="text-[11px] font-bold px-2.5 py-1 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20">
              ${item.status || 'Pending'}
            </span>
          </div>

          <p class="text-xs text-zinc-300 leading-relaxed">${item.description}</p>

          <div class="pt-2 border-t border-zinc-800/60 flex items-center justify-between text-[11px] text-zinc-500">
            <span>Phone: ${item.phone || 'N/A'}</span>
            <span>${item.gps || 'GPS Recorded'}</span>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
