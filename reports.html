<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Reports - Citizen Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-black text-white font-sans min-h-screen flex flex-col justify-between antialiased pt-6 pb-12 px-4 sm:px-6">

  <main class="max-w-xl mx-auto w-full flex-1 space-y-6">
    <!-- Navigation Header with Reset Button -->
    <header class="flex items-center justify-between py-4 border-b border-zinc-800">
      <a href="citizen.html" class="p-2 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-300 hover:text-white transition-all cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      </a>
      
      <h1 class="text-base font-bold text-white tracking-wide">My Reports</h1>
      
      <div class="flex items-center gap-2">
        <!-- Developer Reset Button -->
        <button onclick="clearAllReports()" class="p-2 rounded-xl bg-red-950/40 border border-red-800/50 text-red-400 hover:bg-red-900/60 transition-all text-xs font-semibold flex items-center gap-1 cursor-pointer" title="Reset Storage">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
          <span class="hidden sm:inline">Reset</span>
        </button>

        <a href="report.html" class="p-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold transition-all cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        </a>
      </div>
    </header>

    <!-- Filter Pills -->
    <div class="flex items-center gap-2 overflow-x-auto pb-1 scrollbar-none">
      <button onclick="filterReports('All')" class="filter-btn active px-4 py-2 rounded-xl bg-blue-600 text-white text-xs font-semibold cursor-pointer transition-all">All</button>
      <button onclick="filterReports('Pending Review')" class="filter-btn px-4 py-2 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-400 text-xs font-semibold cursor-pointer transition-all">Pending</button>
      <button onclick="filterReports('In Progress')" class="filter-btn px-4 py-2 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-400 text-xs font-semibold cursor-pointer transition-all">In Progress</button>
      <button onclick="filterReports('Resolved')" class="filter-btn px-4 py-2 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-400 text-xs font-semibold cursor-pointer transition-all">Resolved</button>
    </div>

    <!-- Dynamic Reports Container -->
    <div id="reportsContainer" class="space-y-4">
      <!-- Injected via JS -->
    </div>
  </main>

  <script>
    let currentFilter = 'All';

    function getStatusBadge(status) {
      switch (status) {
        case 'Resolved':
          return `<span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-emerald-950/80 text-emerald-400 border border-emerald-800/50">Resolved</span>`;
        case 'In Progress':
          return `<span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-amber-950/80 text-amber-400 border border-amber-800/50">In Progress</span>`;
        default:
          return `<span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-blue-950/80 text-blue-400 border border-blue-800/50">Pending Review</span>`;
      }
    }

    function renderReports() {
      const container = document.getElementById('reportsContainer');
      const reports = JSON.parse(localStorage.getItem("user_reports") || "[]");

      const filtered = currentFilter === 'All' 
        ? reports 
        : reports.filter(r => (r.status || 'Pending Review') === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-8 text-center space-y-4 my-8">
            <div class="w-12 h-12 rounded-2xl bg-zinc-800 border border-zinc-700 text-zinc-400 flex items-center justify-center mx-auto">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            </div>
            <div>
              <h3 class="text-base font-bold text-white">No reports found</h3>
              <p class="text-xs text-zinc-400 mt-1">There are no reports matching this filter standard.</p>
            </div>
            <a href="report.html" class="inline-block py-3 px-6 rounded-2xl bg-blue-600 text-white font-semibold text-xs shadow-lg shadow-blue-500/20">
              File a New Report
            </a>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => `
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-5 space-y-4 shadow-xl">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold text-zinc-400">${item.id}</span>
              <span class="text-zinc-600">•</span>
              <span class="text-xs text-zinc-400 font-medium">${item.category || item.type}</span>
            </div>
            ${getStatusBadge(item.status || 'Pending Review')}
          </div>

          <div class="flex gap-4 items-center">
            <img src="${item.photo || item.image}" alt="Preview" class="w-20 h-20 rounded-2xl object-cover bg-zinc-950 border border-zinc-800 flex-shrink-0">
            <div class="space-y-1 overflow-hidden">
              <p class="text-sm font-semibold text-white line-clamp-2">${item.description}</p>
              <p class="text-xs text-zinc-400 truncate">📍 ${item.address}</p>
            </div>
          </div>

          <div class="pt-3 border-t border-zinc-800/80 flex items-center justify-between text-[11px] text-zinc-500 font-medium">
            <span>📅 ${item.date}</span>
            <span>📞 ${item.phone}</span>
          </div>
        </div>
      `).join('');
    }

    function filterReports(status) {
      currentFilter = status;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.innerText.includes(status) || (status === 'Pending Review' && btn.innerText === 'Pending')) {
          btn.className = "filter-btn active px-4 py-2 rounded-xl bg-blue-600 text-white text-xs font-semibold cursor-pointer transition-all";
        } else {
          btn.className = "filter-btn px-4 py-2 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-400 text-xs font-semibold cursor-pointer transition-all";
        }
      });
      renderReports();
    }

    // Function to clear local storage
    function clearAllReports() {
      const confirmed = confirm("Are you sure you want to clear all stored reports?");
      if (confirmed) {
        localStorage.removeItem("user_reports");
        renderReports();
      }
    }

    window.onload = renderReports;
  </script>
</body>
</html>
