<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Citizen App - Incident & Service Reports</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f17; color: #ffffff; }
  </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col justify-between p-4 sm:p-6 pb-28">

  <!-- Header Navigation -->
  <header class="w-full max-w-4xl mx-auto flex items-center justify-between pb-6 border-b border-zinc-800">
    <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='citizen.html'">
      <div class="w-9 h-9 rounded-xl bg-teal-500/20 border border-teal-500/40 flex items-center justify-center shadow-lg shadow-teal-500/10">
        <svg class="w-5 h-5 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h4m-4 0V11m0 0h4m-4 0H9m4 0V5" />
        </svg>
      </div>
      <span class="font-black text-xl tracking-tight text-white">Citizen App</span>
    </div>
    <span class="text-xs font-bold text-zinc-400 bg-zinc-900 border border-zinc-800 px-3 py-1 rounded-full">All Incident Feeds</span>
  </header>

  <!-- Main Feed Area -->
  <main class="w-full max-w-4xl mx-auto flex-1 mt-6 space-y-4">
    <div class="flex items-center justify-between">
      <h1 class="text-xl font-black text-white">Active Reports & Requests</h1>
      <a href="tech.html" class="text-xs font-bold text-teal-400 hover:underline">+ Request Technician</a>
    </div>

    <!-- Reports Feed -->
    <div id="reports-feed" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Injected dynamically via JS -->
    </div>
  </main>

  <!-- Floating Navigation Dock -->
  <div class="fixed bottom-5 left-0 w-full z-40 px-4 pointer-events-none">
    <nav class="max-w-md mx-auto bg-zinc-900/95 backdrop-blur-xl border border-zinc-800/80 rounded-full py-2.5 px-6 shadow-2xl shadow-black pointer-events-auto flex items-center justify-between text-center text-xs font-medium text-zinc-400">
      <a href="citizen.html" class="flex flex-col items-center gap-0.5 hover:text-zinc-200 transition-colors">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span class="text-[10px]">Home</span>
      </a>
      <a href="map.html" class="flex flex-col items-center gap-0.5 hover:text-zinc-200 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
        <span class="text-[10px]">Map</span>
      </a>
      <a href="report.html" class="flex items-center justify-center w-11 h-11 -mt-5 rounded-full bg-blue-600 text-white shadow-lg shadow-blue-500/40 hover:scale-105 transition-transform">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      </a>
      <a href="reports.html" class="flex flex-col items-center gap-0.5 text-teal-400 font-bold">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <span class="text-[10px]">Reports</span>
      </a>
      <a href="profile.html" class="flex flex-col items-center gap-0.5 hover:text-zinc-200 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span class="text-[10px]">Profile</span>
      </a>
    </nav>
  </div>

  <script>
    // Fallback Mock Data stored in LocalStorage format
    const defaultReports = [
      {
        id: "739-A",
        type: "Electrical Repair",
        description: "Streetlight outage causing poor visibility near Civic Center.",
        category: "Technician Request",
        status: "In Progress",
        date: "Today, 09:14 AM",
        image: null,
        audio: null
      },
      {
        id: "802-B",
        type: "Pothole Damage",
        description: "Large road crack on main avenue causing driver hazard.",
        category: "Community Problem",
        status: "Pending Review",
        date: "Yesterday",
        image: null,
        audio: null
      }
    ];

    function loadReportsFeed() {
      const storedReports = JSON.parse(localStorage.getItem('user_reports') || '[]');
      const allReports = storedReports.length > 0 ? storedReports : defaultReports;
      const container = document.getElementById('reports-feed');

      container.innerHTML = allReports.map(item => {
        const isTech = item.category === 'Technician Request';
        const imageSrc = item.image || item.photo || null; // Reads Base64 / Local URL from LocalStorage
        const audioSrc = item.audio || item.voiceNote || null; // Reads audio data from LocalStorage
        const hasAttachments = Boolean(imageSrc || audioSrc);
        const reportStatus = item.status || (isTech ? 'Dispatched' : 'Under Review');

        return `
          <div class="bg-zinc-900/90 border border-zinc-800 hover:border-teal-500/40 rounded-2xl p-5 shadow-xl transition-all space-y-3">
            <div class="flex items-center justify-between">
              <span class="text-[10px] font-black uppercase tracking-wider px-2.5 py-0.5 rounded-full ${isTech ? 'bg-teal-500/10 text-teal-400 border border-teal-500/20' : 'bg-blue-500/10 text-blue-400 border border-blue-500/20'}">
                ${item.category || 'Community Problem'}
              </span>
              <span class="text-[10px] text-zinc-500">${item.date || 'Recently'}</span>
            </div>

            <div>
              <h3 class="text-sm font-bold text-white">${item.type || item.title || 'Report Issue'}</h3>
              <p class="text-xs text-zinc-400 mt-1">${item.description}</p>
            </div>

            ${hasAttachments ? `
              <!-- Expandable Media Accordion -->
              <div class="pt-1">
                <button onclick="toggleMedia('attachments-${item.id}')" class="text-[11px] font-semibold text-blue-400 hover:text-blue-300 flex items-center gap-1.5 focus:outline-none">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/></svg>
                  <span>View Attachments ${imageSrc ? '(Photo)' : ''} ${audioSrc ? '(Voice Note)' : ''}</span>
                </button>

                <div id="attachments-${item.id}" class="hidden mt-3 space-y-2 p-3 rounded-xl border border-zinc-800 bg-zinc-950">
                  ${imageSrc ? `
                    <div class="rounded-lg overflow-hidden border border-zinc-800">
                      <img src="${imageSrc}" alt="Report Attachment" class="w-full h-44 object-cover" />
                    </div>
                  ` : ''}

                  ${audioSrc ? `
                    <div class="pt-1">
                      <span class="text-[10px] font-bold text-zinc-400 uppercase block mb-1">🎤 Voice Note</span>
                      <audio controls class="w-full h-8 rounded-lg">
                        <source src="${audioSrc}" type="audio/mpeg">
                        <source src="${audioSrc}" type="audio/wav">
                        Your browser does not support the audio element.
                      </audio>
                    </div>
                  ` : ''}
                </div>
              </div>
            ` : ''}

            <div class="flex items-center justify-between border-t border-zinc-800/80 pt-3 mt-2">
              <div class="flex items-center gap-2">
                <span class="text-[10px] font-bold text-zinc-500">#${item.id}</span>
                <!-- Community & Tech Status Badge -->
                <span class="text-[9px] font-extrabold uppercase px-2 py-0.5 rounded-full border bg-amber-500/10 text-amber-400 border-amber-500/20">
                  Status: ${reportStatus}
                </span>
              </div>
              
              ${isTech ? `
                <button onclick="openReportTracker('${item.id}')" class="text-xs font-bold text-teal-400 hover:underline flex items-center gap-1">
                  View Tracker ➔
                </button>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleMedia(elementId) {
      const mediaBox = document.getElementById(elementId);
      if (mediaBox) {
        mediaBox.classList.toggle('hidden');
      }
    }

    function openReportTracker(id) {
      window.location.href = `tech.html?id=${id}&view=track`;
    }

    window.onload = loadReportsFeed;
  </script>
</body>
</html>
