<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Citizen App - Incident & Service Reports</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f17; color: #ffffff; }
  </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col justify-between p-4 sm:p-6 pb-24">

  <!-- Navigation Header -->
  <header class="w-full max-w-4xl mx-auto flex items-center justify-between pb-6 border-b border-zinc-800">
    <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='citizen.html'">
      <div class="w-9 h-9 rounded-full bg-teal-500/20 border border-teal-500/40 flex items-center justify-center">
        <svg class="w-5 h-5 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      </div>
      <span class="font-bold text-lg text-white">Citizen App</span>
    </div>
    <span class="text-xs font-bold text-zinc-400 bg-zinc-900 border border-zinc-800 px-3 py-1 rounded-full">All Incident Feeds</span>
  </header>

  <!-- Content Container -->
  <main class="w-full max-w-4xl mx-auto flex-1 mt-6 space-y-4">
    <div class="flex items-center justify-between">
      <h1 class="text-xl font-black text-white">Active Reports & Requests</h1>
      <a href="tech.html" class="text-xs font-bold text-teal-400 hover:underline">+ Request Technician</a>
    </div>

    <!-- Reports Feed Container -->
    <div id="reports-feed" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Injected via JavaScript -->
    </div>
  </main>

  <script>
    // Default Mock Feed Items
    const defaultReports = [
      {
        id: "739-A",
        type: "Electrical Repair",
        description: "Streetlight outage causing poor visibility near Civic Center.",
        category: "Technician Request",
        date: "Today, 09:14 AM"
      },
      {
        id: "802-B",
        type: "Pothole Damage",
        description: "Large road crack on main avenue.",
        category: "Community Problem",
        date: "Yesterday"
      }
    ];

    function loadReportsFeed() {
      const storedReports = JSON.parse(localStorage.getItem('user_reports') || '[]');
      const allReports = [...storedReports, ...defaultReports];
      const container = document.getElementById('reports-feed');

      container.innerHTML = allReports.map(item => `
        <div onclick="openReportTracker('${item.id}')" class="bg-zinc-900/90 border border-zinc-800 hover:border-teal-500/50 rounded-2xl p-5 shadow-xl cursor-pointer transition-all hover:scale-[1.01] space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-[10px] font-black uppercase tracking-wider px-2.5 py-0.5 rounded-full ${item.category === 'Technician Request' ? 'bg-teal-500/10 text-teal-400 border border-teal-500/20' : 'bg-blue-500/10 text-blue-400 border border-blue-500/20'}">
              ${item.category || 'Incident Report'}
            </span>
            <span class="text-[10px] text-zinc-500">${item.date}</span>
          </div>

          <div>
            <h3 class="text-sm font-bold text-white">${item.type}</h3>
            <p class="text-xs text-zinc-400 mt-1 line-clamp-2">${item.description}</p>
          </div>

          <div class="flex items-center justify-between border-t border-zinc-800/80 pt-3">
            <span class="text-[10px] font-bold text-zinc-500">Ticket #${item.id}</span>
            <span class="text-xs font-bold text-teal-400 flex items-center gap-1">
              View Tracker ➔
            </span>
          </div>
        </div>
      `).join('');
    }

    function openReportTracker(id) {
      // Directs to tech.html live tracking view
      window.location.href = `tech.html?id=${id}&view=track`;
    }

    window.onload = loadReportsFeed;
  </script>
</body>
</html>
