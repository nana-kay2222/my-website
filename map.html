<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Map - Citizen App</title>

  <!-- Circular Favicon -->
  <link rel="icon" type="image/png" href="citizen_platform_logo.png" />

  <!-- Tailwind CSS v4 -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body {
      background-color: #0b0f17;
      color: #ffffff;
    }
    #map {
      height: calc(100vh - 80px);
      width: 100%;
      border-radius: 1.5rem;
      z-index: 10;
    }
    .leaflet-popup-content-wrapper {
      background-color: #18181b;
      color: #ffffff;
      border: 1px solid #27272a;
      border-radius: 1rem;
    }
    .leaflet-popup-tip {
      background-color: #18181b;
    }
  </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col justify-between pb-24">

  <!-- Top Navigation Header -->
  <header class="w-full max-w-5xl mx-auto px-6 pt-6 flex items-center justify-between">
    <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='citizen.html'">
      <img src="citizen_platform_logo.png" alt="Citizen Logo" class="w-9 h-9 rounded-full object-cover border border-neutral-800 shadow-sm" />
      <span class="font-bold text-lg">Citizen App</span>
    </div>

    <!-- Sign Out Redirects to index.html -->
    <a href="index.html" class="px-4 py-2 rounded-full bg-neutral-900 border border-neutral-800 text-xs font-semibold text-slate-300 hover:bg-neutral-800 transition-all">
      Sign out
    </a>
  </header>

  <!-- Map Main Section -->
  <main class="w-full max-w-5xl mx-auto px-6 pt-4 flex-1 relative">
    
    <!-- Filter Bar Overlay -->
    <div class="absolute top-8 right-10 z-20 flex gap-2">
      <button onclick="filterMarkers('all')" class="px-3.5 py-1.5 rounded-full bg-zinc-900/90 border border-zinc-700 text-xs font-bold text-white hover:bg-zinc-800 backdrop-blur-md shadow-lg transition-all cursor-pointer">
        All Reports
      </button>
      <button onclick="filterMarkers('mine')" class="px-3.5 py-1.5 rounded-full bg-blue-600/90 text-xs font-bold text-white hover:bg-blue-500 backdrop-blur-md shadow-lg transition-all cursor-pointer">
        My Reports
      </button>
    </div>

    <!-- Locate Me Overlay -->
    <div class="absolute bottom-6 right-10 z-20">
      <button onclick="locateUser()" class="p-3 rounded-full bg-zinc-900/90 border border-zinc-700 text-white hover:bg-zinc-800 backdrop-blur-md shadow-lg transition-all cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      </button>
    </div>

    <!-- Leaflet Map Container -->
    <div id="map" class="shadow-2xl border border-zinc-800"></div>
  </main>

  <!-- UNIVERSAL FLOATING PILL NAVIGATION DOCK -->
  <div class="fixed bottom-5 left-0 w-full z-40 px-4 pointer-events-none">
    <nav class="max-w-md mx-auto bg-zinc-900/95 backdrop-blur-xl border border-zinc-800/80 rounded-full py-2.5 px-4 shadow-2xl shadow-black pointer-events-auto flex items-center justify-between text-center text-xs font-medium text-zinc-400">
      
      <!-- Home -->
      <a href="citizen.html" class="flex flex-col items-center gap-0.5 hover:text-zinc-200 transition-colors">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span class="text-[10px]">Home</span>
      </a>

      <!-- Map Active -->
      <a href="map.html" class="flex flex-col items-center gap-0.5 text-blue-400 font-bold">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
        <span class="text-[10px] tracking-tight">Map</span>
      </a>

      <!-- Center Action Button -->
      <a href="citizen.html" class="flex items-center justify-center w-11 h-11 -mt-5 rounded-full bg-blue-600 text-white shadow-lg shadow-blue-500/40 hover:scale-105 transition-transform">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      </a>

      <!-- Reports -->
      <a href="reports.html" class="flex flex-col items-center gap-0.5 hover:text-zinc-200 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <span class="text-[10px]">Reports</span>
      </a>

      <!-- Profile -->
      <a href="profile.html" class="flex flex-col items-center gap-0.5 hover:text-zinc-200 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span class="text-[10px]">Profile</span>
      </a>

    </nav>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map;
    let markersGroup;

    document.addEventListener("DOMContentLoaded", function () {
      // Default initial view: Ghana / Accra region
      map = L.map('map').setView([5.6037, -0.1870], 12);

      // Light OpenStreetMap Tile Layer
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      markersGroup = L.layerGroup().addTo(map);

      // Load Pins
      renderMarkers('all');
    });

    function renderMarkers(filter) {
      markersGroup.clearLayers();

      const sampleReports = [
        { lat: 5.6100, lng: -0.1900, title: "Broken Streetlight", status: "Pending", mine: false },
        { lat: 5.5900, lng: -0.1700, title: "Deep Pothole", status: "In Progress", mine: true },
        { lat: 5.6200, lng: -0.2000, title: "Blocked Drainage", status: "Resolved", mine: false }
      ];

      // Merge dynamic localStorage reports
      const storedReports = JSON.parse(localStorage.getItem("user_reports") || "[]");
      storedReports.forEach(r => {
        if (r.lat && r.lng) {
          sampleReports.push({ lat: r.lat, lng: r.lng, title: r.type || "Reported Issue", status: r.status || "Pending", mine: true });
        }
      });

      sampleReports.forEach(report => {
        if (filter === 'mine' && !report.mine) return;

        const marker = L.marker([report.lat, report.lng]);
        marker.bindPopup(`
          <div class="p-1">
            <h4 class="font-bold text-sm text-white">${report.title}</h4>
            <p class="text-xs text-blue-400 font-semibold mt-1">Status: ${report.status}</p>
          </div>
        `);
        markersGroup.addLayer(marker);
      });
    }

    function filterMarkers(type) {
      renderMarkers(type);
    }

    function locateUser() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
          const { latitude, longitude } = position.coords;
          map.flyTo([latitude, longitude], 15);
          L.circleMarker([latitude, longitude], {
            radius: 8,
            fillColor: "#2563eb",
            color: "#ffffff",
            weight: 2,
            opacity: 1,
            fillOpacity: 0.9
          }).addTo(map).bindPopup("Your Current Location").openPopup();
        }, () => {
          alert("Unable to retrieve location.");
        });
      }
    }
  </script>
</body>
</html>
