<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Citizen App - Map</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #0b0f17;
      color: #ffffff;
    }
    /* Ensure the Leaflet container fills its parent completely */
    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .leaflet-container {
      background: #e5e7eb !important;
    }
  </style>
</head>
<body class="font-sans antialiased flex flex-col h-screen p-4 sm:p-6 overflow-hidden">

  <!-- Top Navigation Header -->
  <header class="w-full max-w-6xl mx-auto flex items-center justify-between pb-4 shrink-0">
    <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='citizen.html'">
      <div class="w-9 h-9 rounded-full bg-teal-500/20 border border-teal-500/40 flex items-center justify-center">
        <svg class="w-5 h-5 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </div>
      <span class="font-bold text-lg text-white">Citizen App</span>
    </div>

    <a href="index.html" class="px-5 py-2 rounded-full bg-zinc-900 border border-zinc-800 text-xs font-semibold text-zinc-300 hover:bg-zinc-800 transition-all">
      Sign out
    </a>
  </header>

  <!-- Main Map Display -->
  <main class="w-full max-w-6xl mx-auto flex-1 relative min-h-0 mb-16">
    
    <!-- Outer Card Frame -->
    <div class="relative w-full h-full rounded-3xl overflow-hidden border border-zinc-800 shadow-2xl">
      
      <!-- Leaflet Map Div -->
      <div id="map"></div>

      <!-- Top-Right Category Filters -->
      <div class="absolute top-4 right-4 z-20 flex items-center gap-2 bg-black/40 backdrop-blur-md p-1.5 rounded-full border border-zinc-800">
        <button onclick="filterMap('all')" id="filter-all" class="px-4 py-2 rounded-full bg-blue-600 text-white text-xs font-bold cursor-pointer">
          All Reports
        </button>
        <button onclick="filterMap('my')" id="filter-my" class="px-4 py-2 rounded-full bg-zinc-900/90 text-zinc-300 hover:bg-zinc-800 text-xs font-bold cursor-pointer">
          My Reports
        </button>
        <button onclick="filterMap('community')" id="filter-community" class="px-4 py-2 rounded-full bg-zinc-900/90 text-zinc-300 hover:bg-zinc-800 text-xs font-bold cursor-pointer">
          Community Reports
        </button>
      </div>

      <!-- Bottom-Right "Where am I?" Button -->
      <button onclick="centerUserLocation()" class="absolute bottom-6 right-6 z-20 px-5 py-3 rounded-2xl bg-zinc-900/95 border border-zinc-800 text-white text-xs font-bold shadow-2xl flex items-center gap-2 hover:bg-zinc-800 transition-all cursor-pointer">
        <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        <span>Where am I?</span>
      </button>

    </div>

  </main>

  <!-- Bottom Floating Navigation -->
  <div class="fixed bottom-5 left-0 w-full z-40 px-4 pointer-events-none">
    <nav class="max-w-md mx-auto bg-zinc-900/95 backdrop-blur-xl border border-zinc-800/80 rounded-full py-2.5 px-6 shadow-2xl shadow-black pointer-events-auto flex items-center justify-between text-center text-xs font-medium text-zinc-400">
      
      <a href="citizen.html" class="flex flex-col items-center gap-0.5 hover:text-zinc-200 transition-colors">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span class="text-[10px]">Home</span>
      </a>

      <a href="map.html" class="flex flex-col items-center gap-0.5 text-blue-400 font-bold">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
        <span class="text-[10px]">Map</span>
      </a>

      <a href="report.html" class="flex items-center justify-center w-11 h-11 -mt-5 rounded-full bg-blue-600 text-white shadow-lg shadow-blue-500/40 hover:scale-105 transition-transform">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      </a>

      <a href="reports.html" class="flex flex-col items-center gap-0.5 hover:text-zinc-200 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <span class="text-[10px]">Reports</span>
      </a>

      <a href="profile.html" class="flex flex-col items-center gap-0.5 hover:text-zinc-200 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span class="text-[10px]">Profile</span>
      </a>

    </nav>
  </div>

  <!-- Backend Script Config -->
  <script src="js/config.js"></script>

  <!-- Leaflet JavaScript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map;
    let markersGroup;
    let allReports = [];

    window.onload = async function() {
      // Initialize Leaflet Map focused on Accra
      map = L.map('map').setView([5.6148, -0.2058], 12);

      // Tile Layer setup
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      markersGroup = L.layerGroup().addTo(map);

      // Prevent map rendering glitches
      setTimeout(() => { map.invalidateSize(); }, 300);

      // Fetch live reports from backend
      await fetchServerReports();
    };

    async function fetchServerReports() {
      try {
        const token = localStorage.getItem('token');
        // FIX: Updated route path to include /api/ prefix
        const response = await fetch(`${API_BASE_URL}/api/reports`, {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json',
            'ngrok-skip-browser-warning': 'true'
          }
        });

        if (!response.ok) {
          throw new Error(`Server returned status: ${response.status}`);
        }

        const data = await response.json();
        allReports = Array.isArray(data) ? data : [];
        renderMarkers('all');

      } catch (error) {
        console.error('Failed to retrieve reports from server:', error);
        allReports = [];
        renderMarkers('all');
      }
    }

    function renderMarkers(filterType) {
      markersGroup.clearLayers();
      const bounds = [];

      allReports.forEach(report => {
        // Parse numerical coordinate data
        const lat = parseFloat(report.lat || report.latitude);
        const lng = parseFloat(report.lng || report.longitude);

        let matches = false;
        const category = report.category || report.type || 'Community Problem';

        if (filterType === 'all') matches = true;
        else if (filterType === 'my') matches = !!report.isOwner || !!report.userId;
        else if (filterType === 'community') matches = (category === 'Community Problem');

        if (matches && !isNaN(lat) && !isNaN(lng)) {
          const title = report.type || report.title || category;
          const address = report.address || report.location || 'Logged GPS';
          const description = report.description || 'No details provided.';

          const popup = `
            <div style="color: #111; font-family: sans-serif; min-width: 140px;">
              <b style="color: #2563eb;">${title}</b><br/>
              <small><b>Location:</b> ${address}</small>
              <p style="margin-top: 4px; font-size: 12px; color: #4b5563;">${description}</p>
            </div>
          `;

          L.marker([lat, lng])
            .bindPopup(popup)
            .addTo(markersGroup);

          bounds.push([lat, lng]);
        }
      });

      // Adjust camera bounds to enclose fetched server points
      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
      }
    }

    function filterMap(type) {
      const btnAll = document.getElementById('filter-all');
      const btnMy = document.getElementById('filter-my');
      const btnComm = document.getElementById('filter-community');

      const inactive = "px-4 py-2 rounded-full bg-zinc-900/90 text-zinc-300 hover:bg-zinc-800 text-xs font-bold cursor-pointer";
      const active = "px-4 py-2 rounded-full bg-blue-600 text-white text-xs font-bold cursor-pointer";

      btnAll.className = inactive;
      btnMy.className = inactive;
      btnComm.className = inactive;

      if (type === 'all') btnAll.className = active;
      if (type === 'my') btnMy.className = active;
      if (type === 'community') btnComm.className = active;

      renderMarkers(type);
    }

    function centerUserLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            map.flyTo([lat, lng], 15);
            L.popup()
              .setLatLng([lat, lng])
              .setContent('<b style="color:#000;">You are here!</b>')
              .openOn(map);
          },
          () => alert("Geolocation access denied or unavailable.")
        );
      } else {
        alert("Geolocation is not supported by your browser.");
      }
    }
  </script>
</body>
</html>
