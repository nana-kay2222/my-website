<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Map - Citizen App</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="citizen_platform_logo.png" />

  <!-- Tailwind CSS v4 -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

  <style>
    body {
      background-color: #0b0f17;
      color: #ffffff;
    }
    #interactive-map {
      width: 100%;
      height: calc(100vh - 180px);
      min-height: 450px;
      border-radius: 1.5rem;
      z-index: 10;
    }
    /* Dark Theme Customizations for Leaflet Popups */
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background-color: #161c28 !important;
      color: #ffffff !important;
      border: 1px solid #2a3447;
      border-radius: 0.75rem;
    }
    .leaflet-container {
      background-color: #0b0f17 !important;
    }
  </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col justify-between pb-24">

  <!-- Top Navigation Header -->
  <header class="w-full max-w-5xl mx-auto px-6 pt-6 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <img src="citizen_platform_logo.png" alt="Logo" class="w-9 h-9 rounded-full object-cover border border-slate-800" />
      <span class="font-bold text-lg">Citizen App</span>
    </div>

    <a href="index.html" class="px-4 py-2 rounded-full bg-neutral-900 border border-neutral-800 text-xs font-semibold text-slate-300 hover:bg-neutral-800 transition-all">
      Sign out
    </a>
  </header>

  <!-- Main Section -->
  <main class="w-full max-w-5xl mx-auto px-6 pt-6 space-y-4">
    
    <!-- Title & Filter Header -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight">Interactive Map</h1>
        <p class="text-slate-400 text-xs mt-0.5">Explore your submitted reports and community issues nearby.</p>
      </div>

      <!-- Filter Toggles -->
      <div class="flex items-center bg-neutral-900 border border-neutral-800 rounded-xl p-1 gap-1 text-xs">
        <button onclick="filterMarkers('all')" id="btn-all" class="px-3 py-1.5 rounded-lg bg-blue-600 font-bold text-white transition-all">
          All Pinpoints
        </button>
        <button onclick="filterMarkers('my')" id="btn-my" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition-all">
          My Reports
        </button>
        <button onclick="filterMarkers('community')" id="btn-community" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition-all">
          Community Reports
        </button>
      </div>
    </div>

    <!-- Map Container -->
    <div class="relative rounded-3xl overflow-hidden border border-neutral-800 shadow-2xl bg-neutral-900">
      
      <!-- GPS Locate Button Overlay -->
      <button onclick="locateMe()" class="absolute top-4 right-4 z-[500] px-3.5 py-2 rounded-xl bg-neutral-900/90 hover:bg-neutral-800 backdrop-blur-md border border-neutral-700 text-xs font-semibold text-blue-400 flex items-center gap-2 shadow-lg transition-all">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span>Locate Me</span>
      </button>

      <div id="interactive-map"></div>
    </div>
  </main>

  <!-- Floating Bottom Navigation Bar -->
  <nav class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-neutral-900/90 backdrop-blur-xl border border-neutral-800 rounded-full px-6 py-2.5 flex items-center gap-8 shadow-2xl z-50">
    <a href="citizen.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span class="text-[10px] font-medium">Home</span>
    </a>

    <a href="map.html" class="flex flex-col items-center gap-1 text-blue-500 font-bold">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l5.447 2.724A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
      <span class="text-[10px]">Map</span>
    </a>

    <a href="#report-modal" class="w-11 h-11 rounded-full bg-blue-600 hover:bg-blue-500 flex items-center justify-center text-white shadow-lg shadow-blue-600/40 -translate-y-2 transition-transform">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
    </a>

    <a href="reports.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      <span class="text-[10px] font-medium">Reports</span>
    </a>

    <a href="profile.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      <span class="text-[10px] font-medium">Profile</span>
    </a>
  </nav>

  <!-- Leaflet Map Script -->
  <script>
    let map;
    let markersList = [];

    const reportsData = [
      { lat: 5.6744, lng: -0.1989, type: 'my', title: "Water Pipe Burst - Haatso", status: "Assigned", category: "Utility" },
      { lat: 5.6698, lng: -0.2031, type: 'my', title: "Streetlight Outage - Main Rd", status: "Submitted", category: "Electrical" },
      { lat: 5.6792, lng: -0.1934, type: 'community', title: "Road Repair - Agbogba", status: "In Progress", category: "Infrastructure" },
      { lat: 5.6820, lng: -0.2010, type: 'community', title: "Overflowing Garbage Bin", status: "Resolved", category: "Sanitation" }
    ];

    document.addEventListener("DOMContentLoaded", function () {
      // Dark Theme Tiles from CartoDB
      map = L.map('interactive-map').setView([5.6744, -0.1989], 14);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        subdomains: 'abcd',
        maxZoom: 19
      }).addTo(map);

      // Render Markers
      reportsData.forEach(item => {
        // Differentiation: Blue pins for user's reports, Emerald/Green pins for community reports
        const pinColor = item.type === 'my' ? '#3b82f6' : '#10b981';

        const customIcon = L.divIcon({
          className: 'custom-pin',
          html: `<div style="background-color: ${pinColor}; width: 18px; height: 18px; border-radius: 50%; border: 3px solid #ffffff; shadow: 0 0 10px ${pinColor};"></div>`,
          iconSize: [18, 18],
          iconAnchor: [9, 9]
        });

        const marker = L.marker([item.lat, item.lng], { icon: customIcon }).addTo(map)
          .bindPopup(`
            <div style="font-family: sans-serif; padding: 4px;">
              <span style="font-size: 10px; font-weight: bold; text-transform: uppercase; color: ${pinColor};">
                ${item.type === 'my' ? 'My Report' : 'Community Report'}
              </span>
              <h4 style="font-size: 13px; font-weight: bold; margin-top: 2px; color: #fff;">${item.title}</h4>
              <p style="font-size: 11px; color: #94a3b8; margin-top: 2px;">Category: ${item.category}<br/>Status: <b>${item.status}</b></p>
            </div>
          `);

        marker.reportType = item.type;
        markersList.push(marker);
      });
    });

    // Dynamic Filter Handler
    function filterMarkers(type) {
      document.querySelectorAll('#btn-all, #btn-my, #btn-community').forEach(btn => {
        btn.className = "px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition-all";
      });
      document.getElementById(`btn-${type}`).className = "px-3 py-1.5 rounded-lg bg-blue-600 font-bold text-white transition-all";

      markersList.forEach(marker => {
        if (type === 'all' || marker.reportType === type) {
          map.addLayer(marker);
        } else {
          map.removeLayer(marker);
        }
      });
    }

    // Geolocation Handler
    function locateMe() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          const { latitude, longitude } = pos.coords;
          map.flyTo([latitude, longitude], 15, { animate: true });
          
          L.circle([latitude, longitude], {
            color: '#3b82f6',
            fillColor: '#3b82f6',
            fillOpacity: 0.3,
            radius: 120
          }).addTo(map).bindPopup("<b style='color:#fff;'>You are here</b>").openPopup();
        });
      }
    }
  </script>
</body>
</html>
